<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ChatGPT Speed Booster</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --glass: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-shadow: 0 8px 32px rgba(100, 100, 120, 0.10);
      --glass-inner: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --text: #1c1c1e;
      --text2: #3a3a3c;
      --muted: #6e6e73;
      --green: #34c759;
      --blue: #007aff;
      --amber: #ff9500;
      --teal: #30b0c7;
      --track-off: #e5e5ea;
      --divider: rgba(0, 0, 0, 0.06);
      --heading: #8ba6ca;
      --seg-bg: #eaf1fb;
      --seg-border: #dce6f1;
      --seg-text: #8ba6ca;
      --r: 20px;
      --r-inner: 16px;
      --font: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 10% 0%, rgba(0, 122, 255, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 90% 0%, rgba(90, 200, 250, 0.10) 0%, transparent 60%);
      color: var(--text);
    }

    .wrap {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .glass {
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: var(--r);
      box-shadow: var(--glass-shadow), var(--glass-inner);
    }

    /* ═══ HEADER ═══ */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #007aff, #3ab0f5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      color: #ff9f0a; /* Orange lightning */
      box-shadow:
        inset 0 1px 3px rgba(255, 255, 255, 0.45),
        0 2px 10px rgba(0, 122, 255, 0.25);
    }

    .app-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .app-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: -0.1px;
    }

    /* ═══ STATUS PILL ═══ */
    .pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
    }

    .pill.live {
      color: #2d9d4e;
      background: rgba(52, 199, 89, 0.08);
      border-color: rgba(52, 199, 89, 0.18);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c7c7cc;
      transition: all 0.3s ease;
    }

    .pill.live .dot {
      background: var(--green);
      box-shadow: 0 0 6px rgba(52, 199, 89, 0.5);
      animation: breathe 2.5s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.45;
        transform: scale(0.8);
      }
    }

    /* ═══ STATS ═══ */
    .stats {
      display: flex;
      gap: 8px;
    }

    .stat-chip {
      flex: 1;
      text-align: center;
      padding: 14px 6px 12px;
    }

    .stat-num {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1.2px;
      line-height: 1;
      margin-bottom: 4px;
      color: var(--text);
    }

    .stat-vis .stat-num {
      color: var(--blue);
    }

    .stat-st .stat-num {
      color: var(--green);
    }

    .stat-st .stat-num.off {
      color: var(--amber);
    }

    .stat-lbl {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
    }

    /* ═══ PANEL ═══ */
    .panel {
      padding: 16px;
    }

    .panel-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--heading);
      margin-bottom: 12px;
    }

    .divider {
      height: 1px;
      background: var(--divider);
      margin: 10px 0;
    }

    /* ═══ CONTROL ROWS ═══ */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0;
    }

    .lbl {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* ═══ iOS UISwitch (51×31) ═══ */
    .sw {
      position: relative;
      width: 51px;
      height: 31px;
      flex-shrink: 0;
    }

    .sw input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .sw .sl {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: var(--track-off);
      border-radius: 999px;
      transition: background 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sw .sl::before {
      content: "";
      position: absolute;
      width: 27px;
      height: 27px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: #fff;
      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.12),
        0 1px 2px rgba(0, 0, 0, 0.08);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sw input:checked+.sl {
      background: var(--blue);
      box-shadow: 0 0 12px rgba(0, 122, 255, 0.2);
    }

    .sw input:checked+.sl::before {
      transform: translateX(20px);
    }

    .sw:active .sl::before {
      transform: scale(0.95);
    }

    .sw:active input:checked+.sl::before {
      transform: translateX(20px) scale(0.95);
    }

    /* ═══ RANGE SLIDER ═══ */
    .range-wrap {
      padding: 8px 0 4px;
    }

    .range-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .range-val {
      font-weight: 800;
      font-size: 17px;
      color: var(--blue);
      letter-spacing: -0.5px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 4px;
      background: var(--track-off);
      background-image: linear-gradient(var(--blue), var(--blue));
      background-size: 22.2% 100%; /* default for 30 */
      background-repeat: no-repeat;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.12),
        0 0 0 1px rgba(0, 0, 0, 0.04);
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.08);
    }

    input[type="range"]:active::-webkit-slider-thumb {
      transform: scale(0.95);
    }

    input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      border: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    /* ═══ iOS SEGMENTED CONTROL ═══ */
    .seg-hint {
      font-size: 11px;
      font-weight: 600;
      color: #1e3a8a;
      text-align: center;
      margin-top: 12px;
      line-height: 1.4;
      transition: color 0.2s ease;
    }

    .seg {
      display: flex;
      position: relative;
      background: var(--seg-bg);
      border: 1px solid var(--seg-border);
      border-radius: 9px;
      padding: 2px;
    }

    .seg-opt {
      flex: 1;
      text-align: center;
      padding: 7px 2px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font);
      color: var(--seg-text);
      cursor: pointer;
      border-radius: 7px;
      position: relative;
      z-index: 1;
      transition: color 0.2s ease;
      user-select: none;
      border: none;
      background: none;
      outline: none;
    }

    .seg-opt:active {
      transform: scale(0.95);
    }

    .seg-opt.active {
      color: var(--blue);
    }

    .seg-chip {
      position: absolute;
      top: 2px;
      bottom: 2px;
      border-radius: 7px;
      background: #fff;
      box-shadow:
        0 1px 4px rgba(0, 0, 0, 0.08),
        0 0 1px rgba(0, 0, 0, 0.04);
      transition:
        left 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 0;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- ═══ Header ═══ -->
    <header class="header">
      <div class="header-left">
        <div class="logo">⚡</div>
        <div>
          <div class="app-name">Speed Booster</div>
          <div class="app-sub">for ChatGPT</div>
        </div>
      </div>
      <div class="pill" id="pill">
        <span class="dot"></span>
        <span id="pillText">Connecting…</span>
      </div>
    </header>

    <!-- ═══ Stats ═══ -->
    <section class="stats">
      <div class="stat-chip glass stat-vis">
        <div class="stat-num" id="sVis">—</div>
        <div class="stat-lbl">Visible</div>
      </div>
      <div class="stat-chip glass">
        <div class="stat-num" id="sTot">—</div>
        <div class="stat-lbl">Total</div>
      </div>
      <div class="stat-chip glass stat-st">
        <div class="stat-num" id="sSt">—</div>
        <div class="stat-lbl">Status</div>
      </div>
    </section>

    <!-- ═══ Controls ═══ -->
    <section class="panel glass">
      <div class="panel-title">Controls</div>

      <div class="row">
        <div>
          <div class="lbl">Enable Booster</div>
          <div class="hint">Limit visible messages for speed</div>
        </div>
        <label class="sw">
          <input id="enabled" type="checkbox" />
          <span class="sl"></span>
        </label>
      </div>

      <div class="divider"></div>

      <div class="range-wrap">
        <div class="range-head">
          <div>
            <div class="lbl">Message Limit</div>
            <div class="hint">How many messages to render</div>
          </div>
          <div class="range-val" id="limVal">30</div>
        </div>
        <input id="msgLimit" type="range" min="10" max="100" step="5" />
      </div>
    </section>

    <!-- ═══ Performance Mode ═══ -->
    <section class="panel glass">
      <div class="panel-title">Performance Mode</div>
      <div class="seg" id="seg">
        <div class="seg-chip" id="segChip"></div>
        <button class="seg-opt active" data-v="40">Fast</button>
        <button class="seg-opt" data-v="100">Balanced</button>
        <button class="seg-opt" data-v="200">Slow</button>
      </div>
      <div class="seg-hint" id="segHint">+40 msgs buffer — fastest load time</div>
    </section>

  </div>
  <script src="popup.js"></script>
</body>

</html>
